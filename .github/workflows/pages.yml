# Copies `npm run build` output into `site/` on branch `main` and commits it.
# GitHub Pages must publish THAT folder (not repo root), or you get dev index + /src/main.ts 404.
#
# Settings → Pages → Deploy from a branch:
#   Branch: main   |   Folder: /site
#
# Commits use [skip ci] so updating site/ does not re-trigger this workflow.

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'site/**'

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Verify production bundle (GitHub project Pages base path)
        run: |
          grep -q '/learner/assets/' dist/index.html || (echo 'dist/index.html missing /learner/assets/' && exit 1)
          ! grep -q 'src="/src/main.ts"' dist/index.html || (echo 'dist still references dev entry' && exit 1)

      - name: Sync site/ and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf site
          cp -r dist site
          git add -f site/
          if git diff --staged --quiet; then
            echo "No site/ changes"
            exit 0
          fi
          git commit -m "chore: update site/ for GitHub Pages [skip ci]"
          git push
