# Deploys the production build to branch `gh-pages` (static files only).
#
# Setup (one time): Repository → Settings → Pages → Build and deployment
#   • Source: "Deploy from a branch" (NOT "GitHub Actions")
#   • Branch: gh-pages   /   Folder: / (root)
#
# If Source stays on "main" + /(root), GitHub serves dev index.html with
# /src/main.ts → blank site. The gh-pages branch only contains `npm run build` output.

name: Deploy GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Verify production bundle (GitHub project Pages base path)
        run: |
          grep -q '/learner/assets/' dist/index.html || (echo 'dist/index.html missing /learner/assets/' && exit 1)
          ! grep -q 'src="/src/main.ts"' dist/index.html || (echo 'dist still references dev entry' && exit 1)

      - name: Push dist to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean: true
          single-commit: true
