# Copies production build from `dist/` to repository root for GitHub Pages
# when Source = Deploy from branch → main → / (root).
#
# Source code lives under `client/`; root `index.html` + `assets/` are build output only.
#
# Commits use [skip ci] so publishing does not re-trigger this workflow.

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'assets/**'
      - 'index.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'favicon.svg'
      - 'icons.svg'
      - 'pwa-192.png'
      - 'pwa-512.png'
      - '.nojekyll'
      - 'workbox-*.js'

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Verify production bundle (GitHub project Pages base path)
        run: |
          grep -q '/learner/assets/' dist/index.html || (echo 'dist/index.html missing /learner/assets/' && exit 1)
          ! grep -qE '\\./src/main\\.ts|/src/main\\.ts' dist/index.html || (echo 'dist still references dev entry' && exit 1)

      - name: Publish dist to repo root
        run: |
          set -e
          for f in index.html manifest.webmanifest sw.js favicon.svg icons.svg .nojekyll; do
            if [ -f "dist/$f" ]; then cp -f "dist/$f" "./$f"; fi
          done
          cp -f dist/pwa-192.png dist/pwa-512.png ./
          rm -rf assets
          cp -R dist/assets ./assets
          cp -f dist/workbox-*.js ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f index.html assets manifest.webmanifest sw.js workbox-*.js favicon.svg icons.svg pwa-192.png pwa-512.png .nojekyll
          if git diff --staged --quiet; then
            echo "No root publish changes"
            exit 0
          fi
          git commit -m "chore: publish Pages build to repo root [skip ci]"
          git push
