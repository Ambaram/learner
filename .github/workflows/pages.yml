# Publishes the Vite `dist/` folder. You MUST set the repo Pages source to this workflow:
# Settings → Pages → Build and deployment → Source: "GitHub Actions".
# If Source is "Deploy from a branch" (e.g. / (root)), GitHub serves the dev index.html
# which loads /src/main.ts from the site root → blank page under /learner/.

name: Deploy GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Verify production bundle (GitHub project Pages base path)
        run: |
          grep -q '/learner/assets/' dist/index.html || (echo 'dist/index.html missing /learner/assets/ — check vite.config.ts base' && exit 1)
          ! grep -q 'src="/src/main.ts"' dist/index.html || (echo 'dist still references dev entry — build misconfigured' && exit 1)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
